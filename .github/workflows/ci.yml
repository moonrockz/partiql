name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned MoonBit toolchain (moon/moonc/core). Bump deliberately; see AGENTS.md.
  MOONBIT_VERSION: "0.10.14+7d59c7ec9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: moon update
      - run: mise run lint:fmt
      - run: mise run lint:check
      - run: mise run lint:info
      - name: Test CI scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: actions/setup-node@v4
        if: matrix.target == 'js'
        with:
          node-version: "24"
      - run: moon update
      - run: mise run test:unit --target ${{ matrix.target }}

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: moon update
      - name: Run conformance suite
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/conformance"
          mise run test:conformance 2>&1 | tee "$RUNNER_TEMP/conformance/moon-test.log"
      - name: Summarize
        if: always()
        run: python3 .github/scripts/conformance_summary.py "$RUNNER_TEMP/conformance/moon-test.log" --json "$RUNNER_TEMP/conformance/results.json"
      - name: Check the baseline is up to date
        run: |
          mise run conformance:ratchet
          git diff --exit-code -- modules/partiql-conformance/baseline || (echo "::error::New conformance passes are not in the baseline. Run 'mise run conformance:ratchet' and commit." && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance

  cli:
    # Linux, macOS and Windows, as in the release build: a release publishes
    # to mooncakes.io before the binaries are built, so main must prove the
    # build on every platform first.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: moon update
      - run: mise run build:cli
      - name: Smoke test
        run: |
          moon run modules/partiql/src --target wasm -- version
          moon run modules/partiql/src --target native -- version
          # The release binary itself, including the terminal check for
          # --color=auto (isatty).
          exe=_build/native/release/build/moonrockz/partiql/partiql.exe
          "$exe" version
          "$exe" check -e 'SELECT a FROM t'
          if "$exe" check -e 'SELECT FROM' 2> err.txt; then exit 1; fi
          grep -q 'error: expected an expression' err.txt
