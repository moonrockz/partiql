name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip mooncakes.io publish (for troubleshooting)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  # Pinned MoonBit toolchain (moon/moonc/core). Bump deliberately; see AGENTS.md.
  MOONBIT_VERSION: "0.10.14+7d59c7ec9"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Guard branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" != "main" ]; then
            echo "Error: Releases can only be triggered from main branch (current: $BRANCH)" >&2
            exit 1
          fi

      - name: Guard tag is on main
        if: github.ref_type == 'tag'
        run: |
          # A publish to mooncakes.io cannot be undone, so a tag on another
          # branch must not release.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Error: tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main" >&2
            exit 1
          fi

      - name: Install dependencies
        run: moon update

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(mise run release:version | tail -1)
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Check all module versions match
        run: mise run release:check-version "${{ steps.version.outputs.version }}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        run: |
          NOTES=$(mise run release:notes)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "notes<<$EOF"
            echo "$NOTES"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pre-release checks
        run: mise run check

  tag:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && needs.validate.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          VERSION="v${{ needs.validate.outputs.version }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Created and pushed tag $VERSION"

  publish:
    needs: [validate, tag]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped') &&
      !(github.event.inputs.skip_publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Set up mooncakes credentials
        run: mise run release:credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}

      - name: Publish modules to mooncakes.io
        run: mise run release:publish

  build-cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: partiql-linux-x64
          - os: macos-latest
            name: partiql-macos-arm64
          - os: windows-latest
            name: partiql-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-moonbit@v1
        with:
          version: ${{ env.MOONBIT_VERSION }}
          core-version: ${{ env.MOONBIT_VERSION }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: moon update

      - name: Build CLI
        run: mise run build:cli

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            _build/native/release/build/moonrockz/partiql/partiql.exe
            _build/wasm/release/build/moonrockz/partiql/partiql.wasm

  release:
    needs: [validate, publish, build-cli]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build-cli.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: mise run release:prepare-assets "${{ needs.validate.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: ${{ needs.validate.outputs.notes }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: release/*
          make_latest: true
